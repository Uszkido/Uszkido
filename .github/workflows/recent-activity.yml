name: Update Recent Activity

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/user-activity-workflow@v1.1.0
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          commit_msg: "docs: update recent activity"
          max_activity: 5
